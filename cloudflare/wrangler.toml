name = "bryant-construction-leads"
main = "worker.js"
compatibility_date = "2026-08-12"
compatibility_flags = ["nodejs_compat"]

[vars]
LEAD_EMAIL = "ajbryantsleads@gmail.com"

[[routes]]
pattern = "bryantconstruct.com/api/*"
zone_name = "bryantconstruct.com"

[[routes]]
pattern = "bryantconstructiongroup.co.uk/api/*"
zone_name = "bryantconstructiongroup.co.uk"

[[r2_buckets]]
binding = "CONTACT_UPLOADS"
bucket_name = "contact-us-form-image-upload-construction"

[[d1_databases]]
binding = "LEADS_DB"
database_name = "bryant-construction-leads"
database_id = "f969696f-5c93-43ff-929b-74c16e0c459d"

[env.preview]
name = "bryant-construction-leads-preview"
routes = []
workers_dev = true

[env.preview.vars]
LEAD_EMAIL = "ajbryantsleads@gmail.com"
CLOUDFLARE_ACCESS_ENABLED = "true"

[[env.preview.d1_databases]]
binding = "LEADS_DB"
database_name = "bryant-construction-leads-preview"
database_id = "7915ba25-7626-4291-8330-d0b0f8c82752"

[[env.preview.r2_buckets]]
binding = "CONTACT_UPLOADS"
bucket_name = "contact-us-form-image-upload-construction-preview"
