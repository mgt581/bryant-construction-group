<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="referrer" content="no-referrer" />
  <title>Lead Dashboard | Bryant Construction Group</title>
  <style>
    :root{color-scheme:dark;--bg:#071a2d;--panel:#0b2a4a;--line:#36516c;--accent:#d18b26}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f7f8fa;font:15px/1.45 Arial,sans-serif}
    main{max-width:1320px;margin:auto;padding:24px}h1{margin:.2rem 0}.muted{color:#b9c7d5}
    .actions,.metrics{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}.button,button{border:0;border-radius:9px;padding:9px 12px;background:var(--accent);color:#111;font-weight:700;text-decoration:none;cursor:pointer}
    .metric,.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}.metric{min-width:150px}
    .metric strong{display:block;font-size:1.7rem}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.wide{grid-column:1/-1}
    table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
    select,input{max-width:125px;padding:7px;background:#173d60;color:white;border:1px solid var(--line);border-radius:7px}
    .controls{display:flex;gap:6px;min-width:480px}@media(max-width:800px){.grid{grid-template-columns:1fr}.controls{min-width:420px}}
  </style>
</head>
<body><main>
  <p class="muted">Private lead dashboard</p>
  <h1 id="title">Bryant Construction Group — Lead Tracking</h1>
  <p class="muted">Cloudflare Access must protect this page and every administration API route.</p>
  <div class="actions">
    <a class="button" href="/api/leads/export">Leads CSV</a>
    <a class="button" href="/api/lead-events/export">Events CSV</a>
  </div>
  <p id="notice" role="status"></p>
  <section class="metrics" id="metrics"></section>
  <section class="grid">
    <article class="card"><h2>Pipeline</h2><table><tbody id="pipeline"></tbody></table></article>
    <article class="card"><h2>Lead origins</h2><table><tbody id="origins"></tbody></table></article>
    <article class="card wide"><h2>Revenue by origin</h2><table><tbody id="revenue"></tbody></table></article>
    <article class="card wide"><h2>Recent leads</h2><div style="overflow:auto"><table><tbody id="leads"></tbody></table></div></article>
    <article class="card wide"><h2>Recent activity</h2><div style="overflow:auto"><table><tbody id="events"></tbody></table></div></article>
  </section>
  <script src="/site-config.js"></script>
  <script>
  (function () {
    "use strict";
    var statuses = ["TEST","NEW","GENUINE","SPAM","CONTACTED","QUOTED","WON","LOST"];
    var esc = function (value) {
      return String(value == null ? "" : value).replace(/[&<>"']/g, function (character) {
        return ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[character];
      });
    };
    var money = function (pence) { return "£" + (Number(pence || 0) / 100).toFixed(2); };
    var config = window.LEADGEN_CONFIG || {};
    var endpoint = config.dashboardEndpoint || "/api/dashboard";
    if (config.businessName) document.getElementById("title").textContent = config.businessName + " — Lead Tracking";

    fetch(endpoint, { headers: { Accept: "application/json" } }).then(function (response) {
      if (!response.ok) throw new Error("Admin sign-in required.");
      return response.json();
    }).then(function (data) {
      var totals = data.totals || {};
      document.getElementById("metrics").innerHTML = [
        ["Leads",totals.leads],["Delivered",totals.delivered_leads],["Failed",totals.failed_leads],["Won",totals.won_leads],
        ["Quoted",money(totals.quoted_value_pence)],["Won revenue",money(totals.won_revenue_pence)],
        ["Page views",(data.event_totals || {}).page_view || 0],["Phone",(data.event_totals || {}).phone_click || 0],
        ["WhatsApp",(data.event_totals || {}).whatsapp_click || 0],["Email",(data.event_totals || {}).email_click || 0]
      ].map(function (item) { return '<article class="metric">' + esc(item[0]) + '<strong>' + esc(item[1] || 0) + "</strong></article>"; }).join("");
      document.getElementById("pipeline").innerHTML = "<tr><th>Status</th><th>Leads</th></tr>" + (data.pipeline_summary || []).map(function (item) { return "<tr><td>" + esc(item.status) + "</td><td>" + esc(item.count) + "</td></tr>"; }).join("");
      document.getElementById("origins").innerHTML = "<tr><th>Origin</th><th>Leads</th></tr>" + (data.origin_summary || []).map(function (item) { return "<tr><td>" + esc(item.origin) + "</td><td>" + esc(item.count) + "</td></tr>"; }).join("");
      document.getElementById("revenue").innerHTML = "<tr><th>Origin</th><th>Leads</th><th>Won</th><th>Quoted</th><th>Revenue</th></tr>" + (data.revenue_origin_summary || []).map(function (item) { return "<tr><td>" + esc(item.origin) + "</td><td>" + esc(item.leads) + "</td><td>" + esc(item.won_leads) + "</td><td>" + money(item.quote_value_pence) + "</td><td>" + money(item.won_revenue_pence) + "</td></tr>"; }).join("");
      document.getElementById("leads").innerHTML = "<tr><th>Time</th><th>Name</th><th>Service</th><th>Source</th><th>Delivery</th><th>Pipeline / values</th></tr>" + (data.recent_leads || []).map(function (lead) {
        return "<tr><td>" + esc(lead.submitted_at) + "</td><td>" + esc(lead.name) + "</td><td>" + esc(lead.service) + "</td><td>" + esc(lead.utm_source || lead.source) + "</td><td>" + esc(lead.delivery_status) + '</td><td><div class="controls" data-id="' + esc(lead.id) + '"><select aria-label="Lead status">' + statuses.map(function (status) { return "<option" + (status === lead.lead_status ? " selected" : "") + ">" + status + "</option>"; }).join("") + '</select><input aria-label="Quote value" type="number" min="0" step=".01" value="' + (Number(lead.quote_value_pence || 0) / 100).toFixed(2) + '"><input aria-label="Won revenue" type="number" min="0" step=".01" value="' + (Number(lead.won_revenue_pence || 0) / 100).toFixed(2) + '"><button type="button">Save</button></div></td></tr>';
      }).join("");
      document.getElementById("events").innerHTML = "<tr><th>Time</th><th>Event</th><th>Page</th><th>Detail</th></tr>" + (data.recent_events || []).map(function (event) { return "<tr><td>" + esc(event.occurred_at) + "</td><td>" + esc(event.event_name) + "</td><td>" + esc(event.page) + "</td><td>" + esc(event.link_text || event.service || event.campaign) + "</td></tr>"; }).join("");
    }).catch(function (error) {
      document.getElementById("notice").textContent = error.message;
    });

    document.getElementById("leads").addEventListener("click", function (event) {
      if (event.target.tagName !== "BUTTON") return;
      var controls = event.target.closest("[data-id]");
      var inputs = controls.querySelectorAll("input");
      event.target.disabled = true;
      fetch("/api/leads/" + controls.dataset.id, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          lead_status: controls.querySelector("select").value,
          quote_value_pence: Math.round(Number(inputs[0].value || 0) * 100),
          won_revenue_pence: Math.round(Number(inputs[1].value || 0) * 100)
        })
      }).then(function (response) {
        if (!response.ok) throw new Error("Update failed");
        location.reload();
      }).catch(function (error) {
        event.target.disabled = false;
        document.getElementById("notice").textContent = error.message;
      });
    });
  })();
  </script>
</main></body>
</html>
